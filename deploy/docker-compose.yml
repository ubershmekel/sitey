name: sitey

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  sitey-public:
    name: sitey-public
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  caddy_data: # TLS certs + Caddy state

# ─── Services ─────────────────────────────────────────────────────────────────
services:
  # ── Sitey Web (SPA builder) ───────────────────────────────────────────────
  # One-shot container: builds the Vue SPA and copies dist to $DATA_ROOT/web/.
  # Caddy serves from there, so web updates never require restarting Caddy.
  sitey-web-builder:
    build:
      context: ..
      dockerfile: web/Dockerfile
    volumes:
      - ${DATA_ROOT:-./data}/web:/output
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Caddy (TLS termination + reverse proxy + static file server) ───────────
  # User static sites are served from /srv/services/<id>/repo/<outputDir>.
  # The sitey-web SPA is served from $DATA_ROOT/web (built by sitey-web-builder).
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # 2019 is NOT exposed on the host — only reachable within sitey-public
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - ${DATA_ROOT:-./data}/web:/srv/web:ro
      - ${DATA_ROOT:-./data}/services:/srv/services:ro
      # Writable access log — sitey-api tails this for analytics (see analytics.md).
      - ${DATA_ROOT:-./data}/caddy-logs:/var/log/caddy
    networks:
      - sitey-public
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  # ── Sitey Updater ─────────────────────────────────────────────────────────
  # Dormant container. sitey-api execs update-docker.sh into it to trigger updates.
  sitey-updater:
    build:
      context: ./updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/sitey-root
      - ${DATA_ROOT:-./data}:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  # ── Sitey API ─────────────────────────────────────────────────────────────
  sitey-api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - caddy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: file:/data/sitey.db
      DATA_ROOT: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Full public URL of this Sitey instance (used for GitHub callback/webhook URLs)
      SITEY_URL: ${SITEY_URL:-}
      # Domain serving the Sitey control panel (e.g. sitey.example.com)
      # If unset, Caddy falls back to :80 with no TLS
      SITEY_DOMAIN: ${SITEY_DOMAIN:-}
      # Let's Encrypt notification email for the management domain
      SITEY_EMAIL: ${SITEY_EMAIL:-}
      # Where to reach the Caddy admin API (default works in Docker)
      CADDY_ADMIN_URL: http://caddy:2019
      # Host-side path to the data directory (for build containers that need bind mounts)
      HOST_DATA_ROOT: ${HOST_DATA_ROOT:-}
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only tail of Caddy's access log for analytics ingest.
      - ${DATA_ROOT:-./data}/caddy-logs:/var/log/caddy:ro
    networks:
      - sitey-public
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
